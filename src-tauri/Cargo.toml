[package]
name = "sainte-devote"
version = "2.2.0"
description = "Sainte Devote (Tauri rewrite, in progress)"
edition = "2021"

[lib]
name = "sainte_devote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api is required for transparent windows (the Window Opacity /
# Window Blur settings). It is also injected by the Tauri CLI, but listing it
# here keeps plain `cargo check` builds correct.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
url = "2"
notify = "8.2"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
zip = { version = "8.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS-only backdrop blur for the Window Blur setting. Tauri already depends on
# this crate for its own vibrancy support, so this adds no new build cost.
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

[profile.release]
# Cargo 1.97.0's deferred debuginfo stripping breaks proc-macro loading on macOS.
strip = false
