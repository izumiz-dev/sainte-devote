[package]
name = "sainte-devote"
version = "2.0.1"
description = "Sainte Devote (Tauri rewrite, in progress)"
edition = "2021"

[lib]
name = "sainte_devote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
url = "2"
notify = "8.2"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
zip = { version = "8.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
# Cargo 1.97.0's deferred debuginfo stripping breaks proc-macro loading on macOS.
strip = false
