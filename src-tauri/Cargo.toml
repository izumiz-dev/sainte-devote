[package]
name = "sainte-devote"
version = "1.7.0"
description = "Sainte Devote (Tauri rewrite, in progress)"
edition = "2021"

[lib]
name = "sainte_devote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
url = "2"
notify = "8.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
