<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Sainte Devote</title>
  <link rel="stylesheet" href="src/main.css" />
  <link id="github-markdown-css" rel="stylesheet" href="node_modules/github-markdown-css/github-markdown-light.css" />
  <link id="highlight-theme" rel="stylesheet" href="node_modules/@highlightjs/cdn-assets/styles/github.min.css" />
</head>

<body>
  <div id="titlebar">
    <div id="center-controls">
      <div id="command-palette-trigger">
        <span>Search tabs, commands or content...</span>
        <span class="shortcut">Ctrl+P</span>
      </div>
      <button id="mode-toggle-btn" title="Toggle Preview/Editor">
        <svg class="icon-edit" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
        </svg>
        <svg class="icon-preview" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
      <button id="settings-btn" title="Settings (Ctrl+,)">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </div>
  <div id="tabs">
    <button class="add-tab-btn">＋</button>
  </div>
  <div id="editor-container">
  </div>
  <div id="preview" class="markdown-body"></div>
  <div id="command-palette-overlay" class="hidden">
    <div id="command-palette">
      <input type="text" id="command-palette-input" placeholder="Type to search tabs, commands, or content..."
        spellcheck="false" autocomplete="off" />
      <div id="command-palette-results"></div>
    </div>
  </div>
  <div id="settings-overlay" class="hidden">
    <div id="settings-modal">
      <div class="settings-header">
        <span>Settings</span>
        <button id="settings-close" title="Close" aria-label="Close">×</button>
      </div>
      <div class="settings-body">
        <div class="settings-group">
          <label class="settings-label">Theme</label>
          <div class="settings-segment" id="settings-theme">
            <button type="button" data-theme="system">System</button>
            <button type="button" data-theme="light">Light</button>
            <button type="button" data-theme="dark">Dark</button>
          </div>
        </div>
        <div class="settings-group">
          <label class="settings-label" for="settings-editor-font">Editor Font</label>
          <select id="settings-editor-font-preset"></select>
          <input id="settings-editor-font" type="text" placeholder="font-family (empty = default)"
            spellcheck="false" autocomplete="off" />
        </div>
        <div class="settings-group">
          <label class="settings-label" for="settings-editor-size">Editor Font Size (px)</label>
          <input id="settings-editor-size" type="number" min="8" max="48" step="1" />
        </div>
        <div class="settings-group">
          <label class="settings-label" for="settings-preview-font">Preview Font</label>
          <select id="settings-preview-font-preset"></select>
          <input id="settings-preview-font" type="text" placeholder="font-family (empty = default)"
            spellcheck="false" autocomplete="off" />
        </div>
        <div class="settings-group">
          <label class="settings-label" for="settings-preview-size">Preview Font Size (px)</label>
          <input id="settings-preview-size" type="number" min="8" max="48" step="1" />
        </div>
      </div>
      <div class="settings-footer">
        <button id="settings-reset" type="button">Reset to defaults</button>
      </div>
    </div>
  </div>
  <!-- Load DOMPurify before Monaco's AMD loader so its UMD build attaches to
       window instead of registering an anonymous AMD module (which collides
       with marked's anonymous define under the AMD loader). -->
  <script src="node_modules/dompurify/dist/purify.min.js"></script>
  <script>
    var require = {
      paths: {
        vs: "node_modules/monaco-editor/min/vs",
        marked: "node_modules/marked/marked.min",
      },
    };
  </script>
  <script src="node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="node_modules/@highlightjs/cdn-assets/highlight.min.js"></script>
  <script src="src/renderer.js"></script>
</body>

</html>
