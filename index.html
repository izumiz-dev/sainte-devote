<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sainte Devote</title>
    <link rel="stylesheet" href="src/main.css" />
    <link
      id="github-markdown-css"
      rel="stylesheet"
      href="node_modules/github-markdown-css/github-markdown-light.css"
    />
  </head>
  <body>
    <div id="tabs">
      <button class="add-tab-btn">＋</button>
    </div>
    <div id="editor-container">
    </div>
    <div id="preview" class="markdown-body"></div>
    <div id="command-palette-overlay" class="hidden">
      <div id="command-palette">
        <input type="text" id="command-palette-input" placeholder="Type to search tabs, commands, or content..." spellcheck="false" autocomplete="off" />
        <div id="command-palette-results"></div>
      </div>
    </div>
    <script>
      var require = {
        paths: {
          vs: "node_modules/monaco-editor/min/vs",
          marked: "node_modules/marked/marked.min",
        },
      };
    </script>
    <script src="node_modules/monaco-editor/min/vs/loader.js"></script>
    <script src="src/renderer.js"></script>
  </body>
</html>
